<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C3381"/>
      <stop offset="100%" stop-color="#101D42"/>
    </linearGradient>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4AD7F4"/>
      <stop offset="100%" stop-color="#019AD9"/>
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

  <!-- Arrière-plan avec coins arrondis et bordure subtile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#019AD9" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Pixels emblématiques Dynace (haut gauche) -->
  <rect x="10" y="13" width="4.5" height="4.5" rx="1" fill="#F59E0B"/>
  <rect x="16" y="11" width="5.5" height="5.5" rx="1.2" fill="#E11D48"/>
  <rect x="11" y="19" width="5.5" height="5.5" rx="1.2" fill="#019AD9"/>
  <rect x="17.5" y="18" width="5" height="5" rx="1" fill="#4AD7F4"/>
  <rect x="12" y="26" width="4" height="4" rx="1" fill="#4AD7F4"/>

  <!-- Lettre D stylisée Dynace -->
  <path d="M 23 17 L 36 17 C 45.5 17 51.5 23 51.5 32 C 51.5 41 45.5 47 36 47 L 23 47 Z" fill="url(#dGrad)"/>
  <!-- Découpe intérieure du D -->
  <path d="M 31 24.5 L 35.5 24.5 C 40.5 24.5 44 27.5 44 32 C 44 36.5 40.5 39.5 35.5 39.5 L 31 39.5 Z" fill="#101D42"/>
  <!-- Arc de reflet interne -->
  <path d="M 31 24.5 C 38 26.5 41 29 41 35 C 38.5 30.5 35 28.5 31 27.5 Z" fill="url(#swooshGrad)" opacity="0.95"/>
</svg>